name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version bump type (patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      existing_version:
        description: 'Existing tagged version to publish without creating a new release (optional)'
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.existing_version && format('v{0}', inputs.existing_version) || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Version bump
        id: version
        if: inputs.existing_version == ''
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          npm version ${{ github.event.inputs.version }} -m "Bump version to %s [skip ci]"
          echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Push changes
        if: inputs.existing_version == ''
        run: git push --follow-tags

      - name: Create GitHub Release
        if: inputs.existing_version == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ steps.version.outputs.VERSION }}" --generate-notes

      - name: Verify existing package version
        if: inputs.existing_version != ''
        env:
          EXPECTED_VERSION: ${{ inputs.existing_version }}
        run: node -e "if (require('./package.json').version !== process.env.EXPECTED_VERSION) process.exit(1)"

      - name: Publish to npm
        run: unset NODE_AUTH_TOKEN; npm publish --access public
